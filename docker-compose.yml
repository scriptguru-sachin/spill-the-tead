services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "composer install --no-interaction && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spill_the_tea
      POSTGRES_USER: spill
      POSTGRES_PASSWORD: spill_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spill -d spill_the_tea"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  backend_vendor:
